<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}</style>
</head>
<body>
<title>Hoja de Vida Estudiantil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: banda institucional azul y oro · barra de filtros fija (curso, alumno, búsqueda, ingresar registro) · ficha del alumno a ancho completo */
:root{
  --bg:#eef0f6; --surface:#ffffff; --sunk:#f5f6fa; --ink:#121a3a; --muted:#59607a; --line:#d5d9e6;
  --navy:#0b1766; --navy-2:#071050; --gold:#f0c419; --gold-ink:#8a6a00; --on-navy:#ffffff;
  --btn-bg:#0b1766; --btn-ink:#ffffff; --sel:#e6e9f6;
  --pos:#2b7a4b; --neg:#b3262f; --apo:#6a4a9e; --jus:#a86c12; --kno:#0f6b74; --sus:#8c1c3a; --ret:#1f6aa5;
  --f-display:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f24; --surface:#121a35; --sunk:#0e1530; --ink:#e6e8f2; --muted:#98a0bd; --line:#26305a;
  --navy:#0b1766; --navy-2:#060d40; --gold:#f3cf3a; --gold-ink:#f3cf3a; --on-navy:#ffffff;
  --btn-bg:#f3cf3a; --btn-ink:#0a0f24; --sel:#1b2550;
  --pos:#62c18d; --neg:#f0767f; --apo:#b89ce6; --jus:#e5b45c; --kno:#5cc6cf; --sus:#ff8fa6; --ret:#79b8f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f24; --surface:#121a35; --sunk:#0e1530; --ink:#e6e8f2; --muted:#98a0bd; --line:#26305a;
  --navy:#0b1766; --navy-2:#060d40; --gold:#f3cf3a; --gold-ink:#f3cf3a; --on-navy:#ffffff;
  --btn-bg:#f3cf3a; --btn-ink:#0a0f24; --sel:#1b2550;
  --pos:#62c18d; --neg:#f0767f; --apo:#b89ce6; --jus:#e5b45c; --kno:#5cc6cf; --sus:#ff8fa6; --ret:#79b8f0; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* banda institucional */
.band{background:linear-gradient(100deg,var(--navy-2),var(--navy) 60%);color:var(--on-navy);border-bottom:4px solid var(--gold)}
.bandin{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.crest{width:58px;height:auto;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.titles{flex:1 1 260px;min-width:0}
.titles h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;margin:0;letter-spacing:.02em;text-transform:uppercase}
.titles p{margin:4px 0 0;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.status{font-size:12px;display:flex;align-items:center;gap:6px;opacity:.9}
.status i{width:8px;height:8px;border-radius:50%;background:#9aa3c7;display:inline-block}
.status.ok i{background:#5fd68f} .status.bad i{background:#ff7b84}

/* barra de filtros */
.filters{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 2px 8px -6px rgba(0,0,0,.25)}
.fin{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding-block:10px}
.fin .field{flex:1 1 170px}
.fin .search{flex:1.4 1 220px;position:relative}
.fin .acts{display:flex;gap:8px;flex-wrap:wrap}
.qres{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px -10px rgba(0,0,0,.35);max-height:320px;overflow:auto;z-index:6}
.qres button{width:100%;display:flex;justify-content:space-between;gap:10px;border:0;background:none;padding:7px 9px;border-radius:4px;text-align:left;cursor:pointer}
.qres button:hover,.qres button:focus-visible{background:var(--sel)}
.qres small{color:var(--muted);white-space:nowrap}

/* genéricos */
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:var(--r);cursor:pointer;font-weight:500;font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-ink);font-weight:600}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#121a3a;font-weight:600}
.btn.danger{color:var(--neg);border-color:color-mix(in srgb,var(--neg) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
input[type=text],input[type=date],input[type=search],input[type=tel],input[type=email],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:72px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:24px;letter-spacing:.01em;margin-bottom:4px}
.empty img{width:72px;opacity:.9;margin-bottom:10px}
.pos{--c:var(--pos)} .neg{--c:var(--neg)} .apo{--c:var(--apo)} .jus{--c:var(--jus)} .kno{--c:var(--kno)} .sus{--c:var(--sus)} .ret{--c:var(--ret)}
.btn.sus{color:var(--sus);border-color:color-mix(in srgb,var(--sus) 45%,var(--line));font-weight:600}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--sus) 50%,var(--line));background:color-mix(in srgb,var(--sus) 10%,var(--surface));color:var(--ink)}
.banner b{color:var(--sus);text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.badge{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--sus);border:1px solid currentColor;border-radius:4px;padding:0 5px;vertical-align:1px}
input[type=number],input[type=time]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;min-width:0}
.estado{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.st{font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.st.ok{color:var(--pos);border-color:color-mix(in srgb,var(--pos) 45%,var(--line))}
.st.warn{color:var(--jus);border-color:color-mix(in srgb,var(--jus) 50%,var(--line));background:color-mix(in srgb,var(--jus) 10%,transparent)}
.evacts{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.btn.sm{padding:4px 10px;font-size:12.5px}
.pad{width:100%;height:190px;background:#ffffff;border:2px dashed var(--line);border-radius:8px;touch-action:none;cursor:crosshair;display:block}
.firmares{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:13px}
.firmares b{display:block;font-size:14px}
.chkrow{display:flex;gap:8px;align-items:flex-start}
.chkrow input{width:17px;height:17px;margin-top:2px;accent-color:var(--navy)}

main{padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}

/* nómina */
.nhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
.nhead h2{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;margin:2px 0 4px;text-transform:uppercase;letter-spacing:.01em}
.tablebox{overflow-x:auto}
table.nom{width:100%;border-collapse:collapse;min-width:640px}
.nom th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:600;background:var(--sunk)}
.nom td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.nom tbody tr{cursor:pointer}
.nom tbody tr:hover{background:var(--sunk)}
.nom .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:44px}
.nom .nm{font-weight:500;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.nom .rut{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.nom th.c,.nom td.c{text-align:center;width:52px}
.dot{font-family:var(--f-mono);font-size:12px;display:inline-block;min-width:26px;padding:1px 5px;border-radius:4px;font-variant-numeric:tabular-nums}
.dot.z{color:var(--line)}
.dot:not(.z){color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);font-weight:500}
.nom th.c{color:var(--c)}
.nom td.chk,.nom th.chk{width:36px;text-align:center;padding-right:0}
.nom input[type=checkbox]{width:17px;height:17px;accent-color:var(--navy);cursor:pointer}
.nom tr.sel{background:var(--sel)}
.nom td.act{text-align:right;width:70px}
.selbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px;background:var(--sel);border-bottom:1px solid var(--line);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.kpi b{display:block;font-family:var(--f-mono);font-size:28px;font-weight:500;line-height:1.1;color:var(--ink)}
.kpi.hl b{color:var(--sus)}
.kpi span{font-size:12.5px;color:var(--muted)}
.inf tbody tr{cursor:default}
.inf td.num,.inf th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.barbox{width:140px;height:9px;background:var(--sunk);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.barbox i{display:block;height:100%;background:var(--sus);border-radius:5px}
.secth{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.secth h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.02em}
.filebox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px dashed var(--line);border-radius:var(--r);background:var(--sunk)}

/* ficha */
.ftop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.perfil{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:22px}
.photo{width:100%;aspect-ratio:3/4;max-width:100%;border-radius:6px;overflow:hidden;background:var(--sunk);border:1px solid var(--line);display:grid;place-items:center;position:relative}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ini{font-family:var(--f-display);font-weight:700;font-size:56px;color:var(--muted);letter-spacing:.02em}
.photo .ini small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;text-align:center;letter-spacing:0}
.fotobtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fotobtns .btn{flex:1 1 auto;justify-content:center;font-size:12.5px;padding:6px 8px}
.pdata{display:flex;flex-direction:column;gap:16px;min-width:0}
.pdata h2{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1;margin:4px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;overflow-wrap:anywhere}
.chipcurso{display:inline-block;background:var(--navy);color:var(--on-navy);border-bottom:2px solid var(--gold);padding:2px 10px;border-radius:4px;font-weight:600;font-size:12.5px;letter-spacing:.04em}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 22px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.facts dd{margin:2px 0 0;overflow-wrap:anywhere;white-space:pre-wrap}
.counts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.count{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;border-top:3px solid var(--c);background:var(--sunk)}
.count b{display:block;font-family:var(--f-mono);font-size:26px;font-weight:500;color:var(--c);line-height:1.1}
.count span{font-size:12.5px;color:var(--muted)}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.seg button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.seg button[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface))}

.tl{padding:18px 22px}
.tlbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.tlbar h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.tlist{list-style:none;margin:8px 0 0;padding:0}
.month{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--gold-ink);padding:16px 0 6px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.06em}
.ev{display:grid;grid-template-columns:4px minmax(0,1fr);gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.ev .mk{background:var(--c);border-radius:2px}
.evtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--c)}
.pill{font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid currentColor}
.pill.grave{color:var(--jus)} .pill.gravisima{color:var(--neg);background:color-mix(in srgb,var(--neg) 12%,transparent)} .pill.leve{color:var(--muted)}
.evtop time{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ev p{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:80ch}
.extra{margin:6px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:13px}
.extra dt{color:var(--muted)} .extra dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.evfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}

/* ventana modal */
.overlay{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,#000 55%,transparent);display:flex;align-items:flex-start;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));overflow:auto}
.modal{width:100%;max-width:680px;background:var(--surface);border-radius:10px;border-top:5px solid var(--gold);box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.mbody{padding:18px 20px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 20px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.inlinereg{border-top:4px solid var(--gold);scroll-margin-top:120px}
.cam{position:relative;width:100%;max-width:360px;margin:0 auto;aspect-ratio:3/4;background:#000;border-radius:8px;overflow:hidden}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;display:block}
.cam video{transform:scaleX(-1)}
.tipobox{border-left:4px solid var(--c);padding-left:14px;display:flex;flex-direction:column;gap:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);font-size:13px;z-index:40;max-width:calc(100% - 32px)}

@media (max-width:760px){
  .perfil{grid-template-columns:1fr;padding:16px}
  .fotocol{max-width:200px}
  .counts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  .pdata h2{font-size:30px}
  .titles h1{font-size:24px}
  .tl{padding:16px}
  .fin .acts{width:100%}
  .fin .acts .btn{flex:1 1 auto;justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* Inspector General que firma según nivel: 1° y 2° Medio / 3° y 4° Medio */
function inspectorDe(cursoNombre){
  const m=String(cursoNombre||"").match(/^\s*([1-4])/);const n=m?Number(m[1]):0;
  if(n===1||n===2)return{nombre:"Claudio Valenzuela Fuentes",cargo:"Inspector General · 1° y 2° Medio"};
  if(n===3||n===4)return{nombre:"Luis Cádiz Fuenzalida",cargo:"Inspector General · 3° y 4° Medio"};
  return{nombre:"",cargo:"Inspector(a) General"};
}
const TITULAR_PRES=/^Presencial: apoderado\(a\) titular/;
function retirosPendientes(aid,exceptoId){return S.retiros.filter(e=>e.alumnoId===aid&&!e.firmado&&e.id!==exceptoId).sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""))}

function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null||v===false) continue;
    if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if(k==="class") e.className=v;
    else if(k==="text") e.textContent=v;
    else if(k==="value") e.value=v;
    else e.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)))}
  return e;
}

function enPeriodo(e,p){
  if(p==="todo")return true; const f=e.fecha||""; const y=hoy().slice(0,4);
  if(p==="mes"){const d=new Date();d.setDate(d.getDate()-30);return f>=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}

async function procesarFoto(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image(); await new Promise((ok,ko)=>{img.onload=ok;img.onerror=ko;img.src=url});
    const W=360,H=480,c=document.createElement("canvas");c.width=W;c.height=H;const ctx=c.getContext("2d");
    const sr=img.naturalWidth/img.naturalHeight,tr=W/H;let sw,sh,sx,sy;
    if(sr>tr){sh=img.naturalHeight;sw=sh*tr;sx=(img.naturalWidth-sw)/2;sy=0}else{sw=img.naturalWidth;sh=sw/tr;sx=0;sy=(img.naturalHeight-sh)/4}
    ctx.fillStyle="#ffffff";ctx.fillRect(0,0,W,H);ctx.drawImage(img,sx,sy,sw,sh,0,0,W,H);
    return c.toDataURL("image/jpeg",0.82);
  } finally {URL.revokeObjectURL(url)}
}

async function siguienteFolio(){
  const y=hoy().slice(0,4);const ref=db.doc("contadores/folio-"+y);const holder=(S.uid||"anon")+"-"+Math.random().toString(36).slice(2);
  for(let i=0;i<25;i++){
    const r=await ref.acquire({holder,ttlMs:6000});
    if(r&&r.acquired){const snap=await ref.get();const n=((snap.exists&&Number(snap.data().n))||0)+1;
      await ref.set({n,anio:y,actualizado:new Date().toISOString()});return y+"-"+String(n).padStart(5,"0")}
    await new Promise(ok=>setTimeout(ok,250+Math.random()*300));
  }
  throw new Error("folio");
}

function cargarXLSX(){
  if(window.XLSX)return Promise.resolve();
  return new Promise((ok,ko)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";sc.onload=ok;sc.onerror=ko;document.head.append(sc)});

async function leerArchivo(input){
  const f=input.files[0]; input.value=""; if(!f)return;
  $("iFileName").textContent="Leyendo "+f.name+"…";
  try{
    await cargarXLSX();
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:""}).map(r=>r.map(x=>String(x).trim())).filter(r=>r.some(Boolean));
    if(!rows.length){$("iFileName").textContent="El archivo no tiene filas.";return}
    let map=[0,1,2,3,4],start=0;
    const hi=rows.slice(0,5).findIndex(r=>r.some(x=>/nombre|alumno|estudiante/i.test(x)));
    if(hi>=0){
      const hdr=rows[hi].map(sinTildes); const find=re=>hdr.findIndex(x=>re.test(x));
      const iNom=find(/nombre|alumno|estudiante/),iApe=find(/apellido/);
      map=[iNom,find(/rut|run/),find(/apoderad/),find(/fono|telef|celular|movil/),find(/correo|mail/)];
      start=hi+1;
      if(iApe>=0&&iApe!==iNom){map.ape=iApe}
    }
    const lineas=rows.slice(start).map(r=>{
      let nom=map[0]>=0?r[map[0]]:""; if(map.ape!=null&&r[map.ape]) nom=r[map.ape]+", "+nom;
      return [nom,...map.slice(1).map(i=>i>=0?(r[i]||""):"")].map(x=>x.replace(/[\t\r\n]+/g," ")).join("\t");
    }).filter(l=>l.split("\t")[0].replace(/,\s*$/,"").trim());
    $("iText").value=lineas.join("\n");
    $("iFileName").textContent=f.name+": "+lineas.length+" alumnos listos. Revisa y presiona Importar.";
  }catch(e){$("iFileName").textContent="No pude leer el archivo. Prueba guardarlo como .xlsx o .csv, o pega las filas abajo."}
}

function fechaISO(d){return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function aFecha(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function esHabil(d){const w=d.getDay();return w!==0&&w!==6}
function sigHabil(s){const d=aFecha(s);do{d.setDate(d.getDate()+1)}while(!esHabil(d));return fechaISO(d)}
/* Días corridos (incluye sábados y domingos); el día en que se aplica la medida no se cuenta. */
function calcSusp(base,dias){
  const d=aFecha(base);d.setDate(d.getDate()+1);const ini=fechaISO(d);
  d.setDate(d.getDate()+Math.max(1,dias)-1);const fin=fechaISO(d);
  return{ini,fin,reintegro:sigHabil(fin)};
}
